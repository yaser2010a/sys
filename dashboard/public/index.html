<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>داشبورد البوت</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar">
    <h2>🤖 داشبورد البوت</h2>
    <div class="spacer"></div>
    <button class="secondary" onclick="logout()">تسجيل خروج</button>
  </div>

  <div id="guilds" class="guild-grid">
    <div class="empty-state">جاري التحميل...</div>
  </div>

  <script>
    async function loadGuilds() {
      const res = await fetch('/api/guilds');
      if (res.status === 401) return window.location.href = '/login';
      const guilds = await res.json();

      const container = document.getElementById('guilds');
      if (guilds.length === 0) {
        container.innerHTML = '<div class="empty-state">البوت مو موجود بأي سيرفر حالياً</div>';
        return;
      }

      container.innerHTML = guilds.map(g => `
        <div class="guild-card" onclick="location.href='/guild/${g.id}'">
          ${g.icon ? `<img src="${g.icon}">` : '<div style="width:64px;height:64px;border-radius:50%;background:var(--bg-tertiary);margin:0 auto 10px;"></div>'}
          <div><strong>${g.name}</strong></div>
          <div style="color:var(--text-muted); font-size:13px;">${g.memberCount} عضو</div>
        </div>
      `).join('');
    }

    async function logout() {
      await fetch('/api/logout', { method: 'POST' });
      window.location.href = '/login';
    }

    loadGuilds();
  </script>
</body>
</html>
