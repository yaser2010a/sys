<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تسجيل الدخول - داشبورد البوت</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-box">
      <h1>🔐 داشبورد البوت</h1>
      <p style="color: var(--text-muted); font-size: 13px;">أدخل كلمة المرور للدخول للتحكم بالبوت</p>
      <input type="password" id="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter') login()">
      <button onclick="login()" style="width:100%; margin-top:10px;">دخول</button>
      <div class="error-msg" id="error"></div>
    </div>
  </div>

  <script>
    async function login() {
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password }),
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          errorEl.textContent = data.error || 'صار خطأ';
        }
      } catch (err) {
        errorEl.textContent = 'تعذر الاتصال بالسيرفر';
      }
    }
  </script>
</body>
</html>
